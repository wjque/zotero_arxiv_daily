name: Quality profile maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Generate, inspect, activate, roll back, or disable a quality profile
        required: true
        default: inspect
        type: choice
        options:
          - generate
          - inspect
          - approve
          - rollback
          - clear-approval
      version:
        description: Profile version required by approve and rollback; optional for inspect
        required: false
        type: string
      policy_version:
        description: Registered interpretation policy; empty uses the application default
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: zotero-arxiv-daily-production
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install uv && uv sync --locked --all-groups
      - name: Restore encrypted production state
        env:
          ZAD_STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          mkdir -p runtime
          git fetch --no-tags origin state
          git worktree add --detach runtime/state FETCH_HEAD
          test -f runtime/state/state.enc.json
          test "$(find runtime/state -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 1
          uv run zotero-arxiv-daily state decrypt \
            --input runtime/state/state.enc.json --output-dir runtime
          if test -f runtime/quality-profile.json; then
            cp runtime/quality-profile.json runtime/quality-profile.before.json
          fi
      - name: Generate unapproved candidate
        if: inputs.operation == 'generate'
        id: generate
        env:
          REVIEWED_QUALITY_EXAMPLES: ${{ secrets.QUALITY_PROFILE_EXAMPLES }}
          POLICY_VERSION: ${{ inputs.policy_version }}
        run: |
          set -euo pipefail
          test -n "$REVIEWED_QUALITY_EXAMPLES" || {
            echo "Production environment secret QUALITY_PROFILE_EXAMPLES is empty." >&2
            exit 1
          }
          umask 077
          printf '%s' "$REVIEWED_QUALITY_EXAMPLES" > runtime/reviewed-quality-examples.json
          policy_arguments=()
          if test -n "$POLICY_VERSION"; then
            policy_arguments+=(--policy-version "$POLICY_VERSION")
          fi
          result=$(uv run zotero-arxiv-daily quality-profile generate \
            --examples runtime/reviewed-quality-examples.json "${policy_arguments[@]}")
          version=${result##*: }
          case "$version" in
            quality-profile-*) ;;
            *) echo "Generated profile version is invalid." >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Change approval pointer
        if: inputs.operation == 'approve' || inputs.operation == 'rollback' || inputs.operation == 'clear-approval'
        env:
          OPERATION: ${{ inputs.operation }}
          PROFILE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if test "$OPERATION" = "clear-approval"; then
            uv run zotero-arxiv-daily quality-profile clear-approval
          else
            test -n "$PROFILE_VERSION" || {
              echo "A profile version is required for $OPERATION." >&2
              exit 1
            }
            uv run zotero-arxiv-daily quality-profile "$OPERATION" --version "$PROFILE_VERSION"
          fi
      - name: Inspect privacy-safe aggregate
        if: inputs.operation != 'clear-approval'
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_VERSION: ${{ inputs.version }}
          GENERATED_VERSION: ${{ steps.generate.outputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if test "$OPERATION" = "generate"; then version="$GENERATED_VERSION"; fi
          arguments=()
          if test -n "$version"; then arguments+=(--version "$version"); fi
          uv run zotero-arxiv-daily quality-profile inspect "${arguments[@]}" \
            | tee runtime/quality-profile-inspect.json
          {
            echo "## Privacy-safe quality profile"
            echo '```json'
            cat runtime/quality-profile-inspect.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report cleared approval
        if: inputs.operation == 'clear-approval'
        run: echo "Quality profile approval is disabled; registered versions remain available." >> "$GITHUB_STEP_SUMMARY"
      - name: Persist encrypted profile state
        if: inputs.operation != 'inspect'
        env:
          ZAD_STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if test -f runtime/quality-profile.before.json \
            && cmp -s runtime/quality-profile.before.json runtime/quality-profile.json; then
            echo "Quality profile state is unchanged."
            exit 0
          fi
          if test ! -f runtime/quality-profile.before.json \
            && test ! -f runtime/quality-profile.json; then
            echo "Quality profile state is unchanged."
            exit 0
          fi
          uv run zotero-arxiv-daily state encrypt \
            --input-dir runtime --output runtime/state.enc.json
          git -C runtime/state rm -f -- '*.json' || true
          cp runtime/state.enc.json runtime/state/
          git -C runtime/state add -A -- '*.json'
          git -C runtime/state \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(state): maintain quality profile'
          for attempt in 1 2 3; do
            if git -C runtime/state push origin HEAD:state; then exit 0; fi
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 2))
          done
